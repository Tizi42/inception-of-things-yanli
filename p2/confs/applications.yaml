apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-content
  namespace: iot-apps
data:
  index.html: |
    <!doctype html>
    <html lang="en"><head><meta charset="utf-8"><title>app1</title></head>
    <body><h1>Hello from app1</h1><p>Routed by the app1.com host rule.</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: iot-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: app1-content
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: iot-apps
spec:
  selector:
    app: app1
  ports:
    - name: http
      port: 80
      targetPort: http
---
